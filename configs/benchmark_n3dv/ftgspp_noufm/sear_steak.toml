# FreeTimeGS++ final preset (configs/dynerf/ftgspp/sear_steak.toml) without UFM motion-adapted init.
# Config.load resolves only one 'extends' level, so ftgspp overrides are repeated here.
extends = "../../dynerf/ftgs/sear_steak.toml"

[data]
video_path = "/media/tsaichenghan/2TBSSD/datasets/sear_steak"
calibration_path = "/media/tsaichenghan/2TBSSD/datasets/sear_steak/poses_bounds.npy"
extracted_path = "_extracted/sear_steak"
memmap_path = "_memmap/sear_steak"
colmap_path = "_colmap/sear_steak"
eval_cameras = { "start" = 0, "stop" = 1 }
train_cameras = { "start" = 1, "stop" = 21 }

[init]
points_path = "_points/sear_steak"
temporal_motion_adapted = false

[train]
color_correction = true
color_correction_start = 3000
color_corrector_weight = 1e-3

[model]
max_duration = 1
marginal_gating = true
